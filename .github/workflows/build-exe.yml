name: build-windows-exe

# Сборка автономного summary-estimate.exe на облачной Windows-машине.
# PyInstaller не умеет кросс-компиляцию, поэтому Windows .exe собирается здесь.
#
# Запуск:
#   - вручную: вкладка Actions -> "build-windows-exe" -> Run workflow
#   - автоматически: при push/PR в ветку master (только сборка + артефакт)
#   - релиз: при push тега v* (сборка + публикация exe в GitHub Releases)
#
# Версия exe — из version.py. Новый релиз: поменять __version__,
# закоммитить, поставить тег v<версия> (напр. v2026.10.15), запушить тег.
# Сметчица качает exe со страницы Releases (артефакты живут 7 дней).
#
# ПРИВАТНАЯ СБОРКА (с реальными реквизитами, не заглушками):
#   - значения лежат в секрете репозитория SMETA_CONFIG_JSON (Settings ->
#     Secrets and variables -> Actions), в открытом виде нигде не светятся;
#   - запуск: Actions -> build-windows-exe -> Run workflow -> поставить галочку
#     private_config. В карточке запуска виден только сам факт галочки,
#     значения секрета GitHub подменяет на *** в логах.
#   - ВНИМАНИЕ: артефакт публичного репо технически скачиваем посторонними,
#     поэтому после скачивания удали его (Artifacts -> корзина) либо качай
#     сразу и удаляй запуск. В Releases приватные сборки НЕ публикуем —
#     release-job срабатывает только на тегах, а теги собираются без секрета.
on:
  workflow_dispatch:
    inputs:
      private_config:
        description: "Собрать с реальными реквизитами из секрета SMETA_CONFIG_JSON"
        type: boolean
        default: false
      publish_release:
        description: "Опубликовать собранный exe в Releases (только обычная сборка, не приватная)"
        type: boolean
        default: false
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: build-exe-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Guardrails (приватное не публикуем)
        if: inputs.private_config == true && inputs.publish_release == true
        run: |
          Write-Error "Запрещено: приватная сборка (реальные реквизиты) не публикуется в Releases."
          exit 1

      - name: Apply private config (only manual runs with the toggle)
        if: inputs.private_config == true
        env:
          SMETA_CONFIG_JSON: ${{ secrets.SMETA_CONFIG_JSON }}
        run: |
          if ([string]::IsNullOrEmpty($env:SMETA_CONFIG_JSON)) {
            Write-Error "Секрет SMETA_CONFIG_JSON пуст или не задан — приватная сборка невозможна."
            exit 1
          }
          # Значение секрета в лог не печатаем — GitHub всё равно замаскирует,
          # но лучше не давать ему повода.
          Set-Content -Path config.json -Value $env:SMETA_CONFIG_JSON -Encoding UTF8
          python -c "import json; d=json.load(open('config.json', encoding='utf-8')); print('private config OK, keys:', sorted(d.keys()))"

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-estimate-exe${{ inputs.private_config == true && '-private' || '' }}
          path: dist/summary-estimate.exe
          if-no-files-found: error
          retention-days: 7

  release:
    # Публикация exe в Releases: либо push тега v*, либо ручной запуск
    # с тумблером publish_release (тег v<версия> создастся сам из version.py).
    # Приватные сборки сюда не попадают (см. guardrail выше).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $v = (python -c "import sys; sys.path.insert(0,'.'); from version import __version__; print(__version__)")
            "name=v$v" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/download-artifact@v4
        with:
          name: summary-estimate-exe
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/summary-estimate.exe
          generate_release_notes: true
