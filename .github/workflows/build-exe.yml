name: build-windows-exe

# Сборка автономного neuro-estimate.exe на облачной Windows-машине.
# PyInstaller не умеет кросс-компиляцию, поэтому Windows .exe собирается здесь.
#
# Запуск:
#   - вручную: вкладка Actions -> "build-windows-exe" -> Run workflow
#   - автоматически: при push/PR в ветку master
#
# Результат: артефакт neuro-estimate.exe (Actions -> выполнение -> Artifacts -> скачать).
on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: build-exe-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --clean build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuro-estimate-exe
          path: dist/neuro-estimate.exe
          if-no-files-found: error
